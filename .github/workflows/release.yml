name: Release

on:
  push:
    branches:
      - master
      - uat # Staging branch, published as a pre-release
  workflow_dispatch: # Manual run: pick the branch in the "Run workflow" dropdown

permissions:
  contents: write # Push tags, changelog and release commits
  issues: write
  pull-requests: write

# Never run two releases at once on the same branch
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # workflow_dispatch can be started from any branch, so only allow the release branches
    if: github.ref_name == 'master' || github.ref_name == 'uat'
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Let semantic-release push with the PAT instead of the default token
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No continue-on-error: a failing test must stop the release
      - name: Test
        run: npm test --if-present

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }} # Personal Access Token
        run: npx semantic-release